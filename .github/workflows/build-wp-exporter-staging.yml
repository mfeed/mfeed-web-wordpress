name: Build wp-exporter image (staging)

on:
  push:
    branches: ["main"]
    paths:
      - "k8s/base/wp-exporter/**"
      - ".github/workflows/build-wp-exporter-staging.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: mfeed-web-staging
  WORKLOAD_ID_PROVIDER: projects/396254140546/locations/global/workloadIdentityPools/gh-pool/providers/gh-provider
  SERVICE_ACCOUNT_EMAIL: gh-gke-deployer@mfeed-web-staging.iam.gserviceaccount.com

  GAR_LOCATION: asia-northeast1
  REPOSITORY:  mfeed-web-staging-repo
  IMAGE_NAME:  wp-exporter
  IMAGE_TAG:   bookworm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token

      - name: Docker login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & Push
        run: |
          set -eu
          IMG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "$IMG" -f k8s/base/wp-exporter/Dockerfile k8s/base/wp-exporter
          docker push "$IMG"
          echo "Pushed: $IMG"
