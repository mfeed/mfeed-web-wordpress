name: Build and Deploy to GKE with wp-content seed (staging)

on:
  push:
    branches: [ "main" ]
    paths:
      - "k8s/**"
      - "docker/wordpress/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: mfeed-web-staging
  GKE_CLUSTER: cluster-1
  GKE_REGION: asia-northeast1
  WORKLOAD_ID_PROVIDER: projects/396254140546/locations/global/workloadIdentityPools/gh-pool/providers/gh-provider
  SERVICE_ACCOUNT_EMAIL: gh-gke-deployer@mfeed-web-staging.iam.gserviceaccount.com

  GAR_LOCATION: asia-northeast1
  REPOSITORY: mfeed-web-staging-repo

  WORDPRESS_TAG: php8.3-apache

  KUSTOMIZE_DIR: k8s/overlays/staging
  NAMESPACE: web-staging
  DEPLOYMENT_NAME: www-mfeed-ad-jp-wordpress

  DOCKERFILE_PATH: docker/wordpress/Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token

      - name: Docker login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compose image names
        run: |
          echo "DST_IMAGE=${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/wordpress:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "DST_IMAGE_LATEST=${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/wordpress:latest" >> "$GITHUB_ENV"
          echo "DST_IMAGE_STABLE=${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/wordpress:stable" >> "$GITHUB_ENV"

      - name: Build image (includes wp-content seed)
        run: |
          docker build \
            -f k8s/base/Dockerfile \
            --build-arg WORDPRESS_TAG="${WORDPRESS_TAG}" \
            -t "$DST_IMAGE" \
            -t "$DST_IMAGE_LATEST" \
            -t "$DST_IMAGE_STABLE" \
            k8s/base

      - name: Push image to GAR
        run: |
          docker push "$DST_IMAGE"
          docker push "$DST_IMAGE_LATEST"
          docker push "$DST_IMAGE_STABLE"
          docker inspect --format='Pushed: {{index .RepoDigests 0}}' "$DST_IMAGE" || true
          
      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
          | tar -xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Update image in kustomization (wordpress + initContainer)
        working-directory: ${{ env.KUSTOMIZE_DIR }}
        run: |
          # sha ではなく stable を参照させる
          kustomize edit set image wordpress="$DST_IMAGE_STABLE"

      - name: Deploy to GKE
        run: |
          kubectl -n "${NAMESPACE}" apply -k "${KUSTOMIZE_DIR}"

      - name: Trigger wp-content sync by seed version (GITHUB_SHA)
        run: |
          # initContainer がこの値を見て同期する
          kubectl -n "${NAMESPACE}" set env deploy/${DEPLOYMENT_NAME} WP_CONTENT_SEED_VERSION="${GITHUB_SHA}"

      - name: Wait for rollout
        run: |
          kubectl -n "${NAMESPACE}" rollout status deploy/${DEPLOYMENT_NAME} --timeout=10m
          kubectl -n "${NAMESPACE}" get pod -o wide
          kubectl -n "${NAMESPACE}" get svc -o wide