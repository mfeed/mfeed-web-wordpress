# This workflow will build a docker container, publish it to Google Container
# Registry, and deploy it to GKE when there is a push to the "main"
# branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Google Kubernetes Engine (container.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Ensure that your repository contains the necessary configuration for your
#    Google Kubernetes Engine cluster, including deployment.yml,
#    kustomization.yml, service.yml, etc.
#
# 3. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Kubernetes Engine Developer (roles/container.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 5. Change the values in the "env" block to match your values.

name: Build and Deploy to GKE (staging)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: mfeed-web-staging
  GAR_LOCATION: asia-northeast1
  GKE_CLUSTER: cluster-1
  GKE_REGION: asia-northeast1
  KUSTOMIZE_DIR: k8s/overlays/staging
  NAMESPACE: default
  DEPLOYMENT_NAME: wordpress
  REPOSITORY: web-apps
  IMAGE: wordpress-app
  WORKLOAD_IDENTITY_PROVIDER: projects/396254140546/locations/global/workloadIdentityPools/gh-pool/providers/gh-provider
  SERVICE_ACCOUNT_EMAIL: gh-gke-deployer@mfeed-web-staging.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WIF で Google にログイン（必ず service_account を指定）
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      # Artifact Registry へ docker login
      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}

      # GKE 認証（リージョン指定）
      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      # 必要な場合のみ: WordPress をビルドしてプッシュ（app/ に Dockerfile がある想定）
      - name: Build and push Docker image
        working-directory: app
        run: |
          TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          LATEST="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:latest"
          docker build -t "${TAG}" -t "${LATEST}" .
          docker push "${TAG}"
          docker push "${LATEST}"

      # Kustomize を取得して展開（テンプレのバグ修正）
      - name: Set up Kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
          | tar -xz
          sudo mv kustomize /usr/local/bin/kustomize

      # Kustomize にイメージタグを反映（images.name はあなたの base に合わせる）
      - name: Update image in kustomization
        working-directory: ${{ env.KUSTOMIZE_DIR }}
        run: |
          IMG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          kustomize edit set image WORDPRESS_IMAGE=${IMG}

      # デプロイ＆ロールアウト監視
      - name: Deploy to GKE
        run: |
          kubectl -n ${NAMESPACE} apply -k ${KUSTOMIZE_DIR}
          kubectl -n ${NAMESPACE} rollout status deploy/${DEPLOYMENT_NAME} --timeout=5m
          kubectl -n ${NAMESPACE} get svc -o wide
