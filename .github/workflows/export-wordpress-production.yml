name: Export WordPress content Production (manual)

on:
  workflow_dispatch:
    inputs:
      export_target:
        description: "What to export"
        type: choice
        required: true
        default: both
        options:
          - both          # db + wp-content
          - db
          - wp-content    # themes/plugins/languages/uploads をまとめて取り込む
          - uploads       # uploads のみ（従来動作）
      commit_message:
        description: "Commit message (optional)"
        required: false
        default: "chore(export): manual snapshot"
      gcs_bucket:
        description: "GCS bucket for Cloud SQL export (gs://...)"
        required: true
        default: "gs://storage-for-dump-1"
      cloudsql_instance:
        description: "Cloud SQL instance name"
        required: true
        default: "mfeed-web-wordpress"
      cloudsql_db:
        description: "DB name"
        required: true
        default: "wordpress"

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: mfeed-web-1
  WORKLOAD_ID_PROVIDER: projects/1058079281039/locations/global/workloadIdentityPools/gh-pool/providers/gh-provider
  SERVICE_ACCOUNT_EMAIL: gh-gke-deployer@mfeed-web-1.iam.gserviceaccount.com

  GKE_CLUSTER: cluster-1
  GKE_REGION: asia-northeast1
  NAMESPACE: web-production
  WORDPRESS_PVC: wp-content-pvc

  OUT_DIR: wordpress-export
  WP_CONTENT_SEED_DIR: k8s/base/wp-content

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for committing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Prepare output dirs
        run: |
          set -eu
          mkdir -p "${OUT_DIR}/db" "${WP_CONTENT_SEED_DIR}"

      # -----------------------------
      # DB export (Cloud SQL -> GCS -> repo)
      # -----------------------------
      - name: Export DB to GCS (Cloud SQL export)
        if: ${{ inputs.export_target == 'db' || inputs.export_target == 'both' }}
        run: |
          set -eu
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "TS=$TS" >> "$GITHUB_ENV"

          EXPORT_URI="${{ inputs.gcs_bucket }}/${{ inputs.cloudsql_instance }}/${TS}.sql.gz"
          echo "EXPORT_URI=$EXPORT_URI" >> "$GITHUB_ENV"

          echo "Exporting Cloud SQL -> $EXPORT_URI"
          gcloud sql export sql "${{ inputs.cloudsql_instance }}" "$EXPORT_URI" \
            --database="${{ inputs.cloudsql_db }}" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Download DB dump from GCS into repo
        if: ${{ inputs.export_target == 'db' || inputs.export_target == 'both' }}
        run: |
          set -eu
          mkdir -p "${OUT_DIR}/db"
          gsutil cp "$EXPORT_URI" "${OUT_DIR}/db/cloudsql-${TS}.sql.gz"

      # -----------------------------
      # wp-content export (PVC -> temp pod -> repo build source)
      #
      # uploads だけでなく themes / plugins / languages も取り込む。
      # GKE 上の WordPress から行った更新は PVC にしか無いため、これを
      # GitHub に戻さないと次回デプロイのシードで上書きされて失われる。
      # -----------------------------
      - name: Create temp pod for PVC access
        if: ${{ inputs.export_target != 'db' }}
        run: |
          set -euo pipefail

          # 念のため既存の wp-export-pvc-reader Podを消す（前回失敗の残骸対策）
          kubectl -n "${NAMESPACE}" delete pod/wp-export-pvc-reader --ignore-not-found

          cat <<YAML | kubectl -n "${NAMESPACE}" apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: wp-export-pvc-reader
            labels:
              app: wp-export-pvc-reader
          spec:
            restartPolicy: Never
            volumes:
              - name: wp-content
                persistentVolumeClaim:
                  claimName: ${WORDPRESS_PVC}
            containers:
              - name: reader
                image: alpine:3.20
                command: ["sh","-lc","sleep 3600"]
                volumeMounts:
                  - name: wp-content
                    mountPath: /wp-content
          YAML

          # 状態が詰まった時に理由が見えるように describe を出す
          kubectl -n "${NAMESPACE}" get pod wp-export-pvc-reader -o wide || true
          kubectl -n "${NAMESPACE}" describe pod wp-export-pvc-reader | sed -n '/Events:/,$p' || true

          # 待機時間も少し伸ばす（Attach待ちの保険）
          kubectl -n "${NAMESPACE}" wait --for=condition=Ready pod/wp-export-pvc-reader --timeout=300s

      - name: Copy wp-content from PVC to repo seed dir
        if: ${{ inputs.export_target != 'db' }}
        run: |
          set -euo pipefail

          WORK=/tmp/wp-content-export
          rm -rf "$WORK"
          mkdir -p "$WORK/wp-content"

          # kubectl cp よりも tar ストリームの方が、ファイル数の多いツリーで安定する
          echo "== pulling wp-content out of the PVC =="
          kubectl -n "${NAMESPACE}" exec wp-export-pvc-reader -- \
            tar -C /wp-content -cf - . > "$WORK/wp-content.tar"

          tar -C "$WORK/wp-content" -xf "$WORK/wp-content.tar"
          rm -f "$WORK/wp-content.tar"

          # このあと rsync --delete をかけるので、取りこぼしで
          # リポジトリ側を全消ししないように健全性を確認する
          echo "== sanity check =="
          for d in themes plugins; do
            if [ ! -d "$WORK/wp-content/$d" ]; then
              echo "aborting: exported tree has no ${d}/ - the PVC copy looks incomplete"
              exit 1
            fi
          done

          FILE_COUNT="$(find "$WORK/wp-content" -type f | wc -l)"
          echo "exported files: ${FILE_COUNT}"
          if [ "$FILE_COUNT" -lt 100 ]; then
            echo "aborting: only ${FILE_COUNT} files exported - the PVC copy looks incomplete"
            exit 1
          fi

          # PVC 上の運用ファイル・WordPress の一時物は Git に持ち込まない
          EXCLUDES=(
            --exclude=.seed-version
            --exclude=.seed-lock/
            --exclude=.seed-stage-*
            --exclude=.seed-retired-*
            --exclude=.DS_Store
            --exclude=debug.log
            --exclude=upgrade/
            --exclude=upgrade-temp-backup/
            --exclude=cache/
            --exclude=*.tmp
          )

          if [ "${{ inputs.export_target }}" = "uploads" ]; then
            SRC="$WORK/wp-content/uploads"
            DST="${WP_CONTENT_SEED_DIR}/uploads"
          else
            SRC="$WORK/wp-content"
            DST="${WP_CONTENT_SEED_DIR}"
          fi

          echo "== syncing ${SRC} -> ${DST} =="
          mkdir -p "$DST"
          rsync -a --delete "${EXCLUDES[@]}" "$SRC"/ "$DST"/

          echo "== exported tree =="
          du -sh "$DST"/* 2>/dev/null || true

      - name: Cleanup temp pod
        if: always()
        run: |
          kubectl -n "${NAMESPACE}" delete pod/wp-export-pvc-reader --ignore-not-found

      # -----------------------------
      # commit & push
      # -----------------------------
      - name: Commit & push changes
        run: |
          set -eu

          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "== changes =="
          git diff --cached --stat | tail -30

          MSG="${{ inputs.commit_message }}"
          git commit -m "$MSG"
          git push
