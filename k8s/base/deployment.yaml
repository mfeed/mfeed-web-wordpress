apiVersion: apps/v1
kind: Deployment
metadata:
  name: www-mfeed-ad-jp-wordpress
  labels:
    app: www-mfeed-ad-jp-wordpress
spec:
  replicas: 3
  selector:
    matchLabels:
      app: www-mfeed-ad-jp-wordpress
  template:
    metadata:
      labels:
        app: www-mfeed-ad-jp-wordpress
    spec:
      serviceAccountName: wordpress-sa
      securityContext:
        fsGroup: 33

      initContainers:
        # wp-content 全体（themes/plugins/languages/uploads …）をイメージの
        # シードから共有 PVC へ反映する。
        # 通常のデプロイでは先に restore-mfeed-wp-content Job が同じ
        # WP_CONTENT_SEED_VERSION で同期済みなので、ここは即 exit する。
        # PVC が空の場合や Job を通さず Pod だけ増えた場合の保険。
        - name: seed-wp-content
          image: wordpress:stable
          imagePullPolicy: Always
          env:
            - name: WP_CONTENT_SEED_VERSION
              value: "dev"
          command: ["/usr/local/bin/sync-wp-content.sh"]
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content

      containers:
        - name: www-mfeed-ad-jp-wordpress
          image: wordpress:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http

          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - |
                    set -eu
                    printf "ok\n" > /var/www/html/healthz || true

          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
            - name: wordpress-config
              mountPath: /var/www/html/wp-config.php
              subPath: wp-config.php
              readOnly: true
            - name: wordpress-config
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
              readOnly: true
            - name: wordpress-config
              mountPath: /var/www/html/.htaccess
              subPath: .htaccess
              readOnly: true

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--port=3306"
            - "--structured-logs"
            - "PROJECT_ID:asia-northeast1:mfeed-web-wordpress"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true

      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
        - name: wordpress-config
          configMap:
            name: wordpress-config