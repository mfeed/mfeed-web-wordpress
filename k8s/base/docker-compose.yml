services:
  db:
    image: mysql:8.4.7
    container_name: mfeed-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mfeed_net
      
  wordpress:
    image: wordpress:6.8-php8.2-apache
    container_name: mfeed-wp
    depends_on:
      - db
      - jpnap_api              # ★ モックAPIに依存させる
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME',    'http://13.159.146.127:8080');
        define('WP_SITEURL', 'http://13.159.146.127:8080');

      # 環境ごとに変える想定の値（後で説明）
      # WP_DOMAIN: "mfeed.local"
      # WP_API_BASE を使う実装にしていればここに書く:
      # WP_API_BASE: "http://www-jpnap-net-wordpress-svc/home/api/wp/v2"
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./wp-config.php:/var/www/html/wp-config.php:ro
      - ./.htaccess:/var/www/html/.htaccess
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
      # - ./htpasswd:/etc/apache2/.htpasswd
      # - ./basic-auth.conf:/etc/apache2/conf-enabled/basic-auth.conf
    networks:
      - mfeed_net

  # ★ 追加：JPNAP WP REST API のモックコンテナ
  jpnap_api:
    build: ./jpnap-api-mock
    container_name: jpnap-api-mock
    restart: always
    networks:
      mfeed_net:
        aliases:
          - www-jpnap-net-wordpress-svc   # ← この名前で wordpress から見える

volumes:
  mysql_data:

networks:
  mfeed_net:
    driver: bridge
