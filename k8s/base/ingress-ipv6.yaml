apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfeed-wordpress-ingress-ipv6
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: wp-gclb-ipv6
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfeed-wordpress-svc
                port:
                  number: 80