apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - backendconfig.yaml
  - ingress.yaml
  - ingress-ipv6.yaml

configMapGenerator:
  - name: mfeed-wordpress-config
    files:
      - config/wp-config.php
      - config/uploads.ini
      - config/.htaccess

generatorOptions:
  disableNameSuffixHash: false

commonLabels:
  app.kubernetes.io/name: mfeed-wordpress
  app.kubernetes.io/part-of: mfeed-web