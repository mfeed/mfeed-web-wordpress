# ------------------------------------------------------------
# GKE + Cloud SQL + GCLB(HTTP) で WordPress(マルチサイト) を公開する最小構成
# ネットワーク基底を /（管理画面を /wp-admin に統一）
#
# 固定タグ + seedバージョンで同期制御:
# - Docker image 内の /seed/wp-content を PVC(/var/www/html/wp-content)へ同期する initContainer
# - 同期の基準は env: WP_CONTENT_SEED_VERSION（workflowで値を変える）
# - uploads/ は保持（削除・上書きしない）
# ------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: web-staging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content-pvc
  namespace: web-staging
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard-rwx
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: web-staging
type: Opaque
stringData:
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: 'MY]H"y4}>7xhV^R6'
  # Cloud SQL Proxy サイドカーが 127.0.0.1:3306 で listen する前提
  WORDPRESS_DB_HOST: "127.0.0.1:3306"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordpress-sa
  namespace: web-staging
  annotations:
    iam.gke.io/gcp-service-account: cloudsql-proxy@mfeed-web-staging.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-config
  namespace: web-staging
data:
  wp-config.php: |
    <?php
    /**
     * The base configuration for WordPress
     *
     * This has been slightly modified (to read environment variables) for use in Docker.
     *
     * @link https://developer.wordpress.org/advanced-administration/wordpress/wp-config/
     * @package WordPress
     */

    // a helper function to lookup "env_FILE", "env", then fallback
    if (!function_exists('getenv_docker')) {
      function getenv_docker($env, $default) {
        if ($fileEnv = getenv($env . '_FILE')) {
          return rtrim(file_get_contents($fileEnv), "\r\n");
        } else if (($val = getenv($env)) !== false) {
          return $val;
        } else {
          return $default;
        }
      }
    }

    // ** Database settings ** //
    // ★ Secret/Env から読む（Cloud SQL Proxy / k8s で矛盾しない）
    define( 'DB_NAME',     getenv_docker('WORDPRESS_DB_NAME', 'wordpress') );
    define( 'DB_USER',     getenv_docker('WORDPRESS_DB_USER', 'wordpress') );
    define( 'DB_PASSWORD', getenv_docker('WORDPRESS_DB_PASSWORD', 'wordpress') );
    define( 'DB_HOST',     getenv_docker('WORDPRESS_DB_HOST', '127.0.0.1:3306') );

    define( 'DB_CHARSET', getenv_docker('WORDPRESS_DB_CHARSET', 'utf8') );
    define( 'DB_COLLATE', getenv_docker('WORDPRESS_DB_COLLATE', '') );

    // keys/salts (dev用途の例)
    define( 'AUTH_KEY',         getenv_docker('WORDPRESS_AUTH_KEY',         'b7af66c8ca3f50163c863e95e12ff9bf4441ce34') );
    define( 'SECURE_AUTH_KEY',  getenv_docker('WORDPRESS_SECURE_AUTH_KEY',  '019a92c13e5fc52ff2912f34a7f9f1b54746cc02') );
    define( 'LOGGED_IN_KEY',    getenv_docker('WORDPRESS_LOGGED_IN_KEY',    '1a2bbd22fcd61ef70c2ef1920fb9fe26d7d71afd') );
    define( 'NONCE_KEY',        getenv_docker('WORDPRESS_NONCE_KEY',        '589fa7de94ac58875dab9c437f783d3a9a5cdc18') );
    define( 'AUTH_SALT',        getenv_docker('WORDPRESS_AUTH_SALT',        'a0fc5a1991211a8afd2aabf7d1fa63ce0ca4e335') );
    define( 'SECURE_AUTH_SALT', getenv_docker('WORDPRESS_SECURE_AUTH_SALT', '5ca47f5aa081ca07e31510e8302fe42a93dd2ca8') );
    define( 'LOGGED_IN_SALT',   getenv_docker('WORDPRESS_LOGGED_IN_SALT',   '1684a267b3b10d55ad1d477f107fff32126820c4') );
    define( 'NONCE_SALT',       getenv_docker('WORDPRESS_NONCE_SALT',       '23be2672f8721abd41a865979e135ecd5da7a736') );

    $table_prefix = getenv_docker('WORDPRESS_TABLE_PREFIX', 'wp_');

    // --- マルチサイト有効化 ---
    define( 'WP_ALLOW_MULTISITE', true );

    if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
      $_SERVER['HTTPS'] = 'on';
    }

    // ★ Deployment の env WORDPRESS_CONFIG_EXTRA を eval する（動的 WP_HOME/WP_SITEURL など）
    if ($configExtra = getenv_docker('WORDPRESS_CONFIG_EXTRA', '')) {
      eval($configExtra);
    }

    // ★ multisite 基本
    define( 'MULTISITE', true );
    define( 'SUBDOMAIN_INSTALL', false );
    if ( ! defined( 'DOMAIN_CURRENT_SITE' ) ) {
      define( 'DOMAIN_CURRENT_SITE', $_SERVER['HTTP_HOST'] );
    }
    define( 'PATH_CURRENT_SITE', '/' );
    define( 'SITE_ID_CURRENT_SITE', 1 );
    define( 'BLOG_ID_CURRENT_SITE', 1 );

    define( 'WP_DEBUG', true );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

    define('ALLOW_UNFILTERED_UPLOADS', true);
    define('FS_METHOD', 'direct');

    if ( ! defined( 'ABSPATH' ) ) {
      define( 'ABSPATH', __DIR__ . '/' );
    }

    require_once ABSPATH . 'wp-settings.php';

  uploads.ini: |
    upload_max_filesize = 128M
    post_max_size = 128M
    memory_limit = 256M

  .htaccess: |
    # BEGIN WordPress
    RewriteEngine On
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteBase /

    # --- ★重要: /{site}/wp-content や /{site}/wp-includes を /wp-content に寄せる ---
    # 例: /transix/wp-content/...  -> /wp-content/...
    RewriteRule ^([_0-9a-zA-Z-]+)/(wp-content|wp-includes)/(.*)$ $2/$3 [L]

    # 通常の静的
    RewriteRule ^(wp-content|wp-includes)/ - [L]

    RewriteRule ^index\.php$ - [L]

    # （必要なら）ms-files
    RewriteRule ^([_0-9a-zA-Z-]+/)?files/(.+) wp-includes/ms-files.php?file=$2 [L]

    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    RewriteRule . index.php [L]
    # END WordPress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: web-staging
  labels:
    app: wordpress
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      serviceAccountName: wordpress-sa
      securityContext:
        fsGroup: 33

      # ★ 固定タグ（例: bookworm） + seedバージョンで同期制御
      # ※ここを固定タグに合わせて変更
      # 今回の固定タグはstable
      initContainers:
        - name: seed-wp-content
          image: asia-northeast1-docker.pkg.dev/mfeed-web-staging/mfeed-web-staging-repo/wordpress:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: WP_CONTENT_SEED_VERSION
              value: "dev"   # ★workflowで値を変えて同期トリガーにする
          command: ["sh","-lc"]
          args:
            - |
              set -eu

              SEED_DIR="/seed/wp-content"
              TARGET="/var/www/html/wp-content"
              VERSION_FILE="${TARGET}/.seed-version"

              if [ ! -d "${SEED_DIR}" ]; then
                echo "seed directory not found: ${SEED_DIR}"
                echo "You must build an image that includes k8s/base/wp-content into /seed/wp-content"
                exit 1
              fi

              desired="${WP_CONTENT_SEED_VERSION:-}"
              current=""
              if [ -f "${VERSION_FILE}" ]; then
                current="$(cat "${VERSION_FILE}" || true)"
              fi

              if [ -n "${desired}" ] && [ "${desired}" = "${current}" ]; then
                echo "wp-content already up-to-date (version=${current})"
                exit 0
              fi

              echo "sync wp-content from ${SEED_DIR} to ${TARGET}"
              echo "  desired=${desired} current=${current}"

              mkdir -p "${TARGET}"

              # 反映対象:
              # - themes, plugins, mu-plugins, languages
              # 反映しない（運用データ）:
              # - uploads など
              for d in themes plugins mu-plugins languages; do
                if [ -d "${SEED_DIR}/${d}" ]; then
                  rm -rf "${TARGET:?}/${d}"
                  mkdir -p "${TARGET}/${d}"
                  tar -C "${SEED_DIR}/${d}" -cf - . | tar -C "${TARGET}/${d}" -xpf -
                fi
              done

              # wp-content 直下の “ファイルだけ” を同期
              find "${SEED_DIR}" -maxdepth 1 -type f \
                ! -name ".seed-version" \
                ! -name "debug.log" \
                -print0 \
                | while IFS= read -r -d '' f; do
                    base="$(basename "$f")"
                    cp -f "$f" "${TARGET}/${base}"
                  done

              chown -R www-data:www-data "${TARGET}" || true

              echo -n "${desired}" > "${VERSION_FILE}"
              echo "seed version updated: ${desired}"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content

      containers:
        - name: wordpress
          image: asia-northeast1-docker.pkg.dev/mfeed-web-staging/mfeed-web-staging-repo/wordpress:stable
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_HOST
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_NAME
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_PASSWORD

            # wp-config.php 側で eval する（動的ホスト依存部分だけここに残す）
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $host = $_SERVER['HTTP_HOST'] ?? 'localhost';
                define('WP_HOME',    'http://' . $host);
                define('WP_SITEURL', 'http://' . $host);

          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - |
                    set -eu
                    printf "ok\n" > /var/www/html/healthz || true

          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content

            # ★ wp-config.php / php.ini を反映
            - name: wordpress-config
              mountPath: /var/www/html/wp-config.php
              subPath: wp-config.php
              readOnly: true

            - name: wordpress-config
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
              readOnly: true

            - name: wordpress-config
              mountPath: /var/www/html/.htaccess
              subPath: .htaccess
              readOnly: true

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--port=3306"
            - "--structured-logs"
            - "mfeed-web-staging:asia-northeast1:mfeed-web-wordpress"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true

      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
        - name: wordpress-config
          configMap:
            name: wordpress-config
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: web-staging
  labels:
    app: wordpress
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"wordpress-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wordpress-backendconfig
  namespace: web-staging
spec:
  healthCheck:
    requestPath: /healthz
    port: 80
    type: HTTP
  securityPolicy:
    name: allow-internal-only
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: web-staging
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: wp-gclb-ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-svc
                port:
                  number: 80
