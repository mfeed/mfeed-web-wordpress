# ------------------------------------------------------------
# GKE + Cloud SQL + GCLB(HTTP) で WordPress(マルチサイト) を公開する最小構成
# 方針2: ネットワーク基底を / に戻す（メイン管理画面を /wp-admin に統一）
#
# - Cloud SQL は cloud-sql-proxy サイドカー
# - GCLB のヘルスチェックは /healthz (200 固定) を使う
# - WP_HOME/WP_SITEURL は HTTP_HOST から決定（固定IP直書きしない）
# - .htaccess は WordPress に生成させる（コンテナ起動時に上書きしない）
# ------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: mfeed
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content-pvc
  namespace: mfeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: mfeed
type: Opaque
stringData:
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: 'MY]H"y4}>7xhV^R6'
  WORDPRESS_DB_HOST: "127.0.0.1:3306"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordpress-sa
  namespace: mfeed
  annotations:
    iam.gke.io/gcp-service-account: cloudsql-proxy@mfeed-web-staging.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: mfeed
  labels:
    app: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      serviceAccountName: wordpress-sa
      securityContext:
        fsGroup: 33
      containers:
        - name: wordpress
          image: wordpress:6.6-php8.2-apache
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_HOST
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_NAME
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_PASSWORD

            # ネットワーク基底は / に統一（/wp-admin と /wp-admin/network が正）
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $host = $_SERVER['HTTP_HOST'] ?? 'localhost';

                define('WP_HOME',    'http://' . $host);
                define('WP_SITEURL', 'http://' . $host);

                define('MULTISITE', true);
                define('SUBDOMAIN_INSTALL', false);
                define('DOMAIN_CURRENT_SITE', $host);
                define('PATH_CURRENT_SITE', '/');
                define('SITE_ID_CURRENT_SITE', 1);
                define('BLOG_ID_CURRENT_SITE', 1);

                // 切り分け用：stderrへ（落ち着いたら false に戻す）
                define('WP_DEBUG', true);
                define('WP_DEBUG_LOG', false);
                define('WP_DEBUG_DISPLAY', true);
                @ini_set('log_errors', '1');
                @ini_set('error_log', '/dev/stderr');

          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - |
                    set -eu
                    printf "ok\n" > /var/www/html/healthz || true
                    # .htaccess は上書きしない（WordPress 側に生成させる）

          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--port=3306"
            - "--structured-logs"
            - "mfeed-web-staging:asia-northeast1:mfeed-web-wordpress"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true

      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: mfeed
  labels:
    app: wordpress
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"wordpress-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wordpress-backendconfig
  namespace: mfeed
spec:
  healthCheck:
    requestPath: /healthz
    port: 80
    type: HTTP
  securityPolicy:
    name: allow-internal-only
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: mfeed
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: wp-gclb-ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-svc
                port:
                  number: 80
