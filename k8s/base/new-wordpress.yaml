# ------------------------------------------------------------
# GKE + Cloud SQL + GCLB(HTTP) で WordPress(マルチサイト) を公開する最小構成
# 方針2: ネットワーク基底を /（管理画面を /wp-admin に統一）
#
# 追加（A方式・Git変更を都度反映）:
# - Docker image 内の /seed/wp-content を PVC(/var/www/html/wp-content)へ同期する initContainer を追加
# - 同期の基準は env: WP_CONTENT_SEED_VERSION（workflowで GITHUB_SHA を注入）
# - uploads/ は保持（削除・上書きしない）
# ------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: mfeed
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content-pvc
  namespace: mfeed
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: mfeed
type: Opaque
stringData:
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: 'MY]H"y4}>7xhV^R6'
  WORDPRESS_DB_HOST: "127.0.0.1:3306"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordpress-sa
  namespace: mfeed
  annotations:
    iam.gke.io/gcp-service-account: cloudsql-proxy@mfeed-web-staging.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: mfeed
  labels:
    app: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      serviceAccountName: wordpress-sa
      securityContext:
        fsGroup: 33

      # --- initContainer: wp-content を seed から PVC に同期 ---
      initContainers:
        - name: seed-wp-content
          # ★ wordpress コンテナと同じイメージ（/seed/wp-content を含む自前ビルド）を使う前提
          image: wordpress:6.6-php8.2-apache
          imagePullPolicy: IfNotPresent
          env:
            - name: WP_CONTENT_SEED_VERSION
              value: "dev"   # ★workflowで GITHUB_SHA に上書きする
          command: ["sh","-lc"]
          args:
            - |
              set -eu

              SEED_DIR="/seed/wp-content"
              TARGET="/var/www/html/wp-content"
              VERSION_FILE="${TARGET}/.seed-version"

              if [ ! -d "${SEED_DIR}" ]; then
                echo "seed directory not found: ${SEED_DIR}"
                echo "You must build an image that includes k8s/base/wp-content into /seed/wp-content"
                exit 1
              fi

              desired="${WP_CONTENT_SEED_VERSION:-}"
              current=""
              if [ -f "${VERSION_FILE}" ]; then
                current="$(cat "${VERSION_FILE}" || true)"
              fi

              if [ -n "${desired}" ] && [ "${desired}" = "${current}" ]; then
                echo "wp-content already up-to-date (version=${current})"
                exit 0
              fi

              echo "sync wp-content from ${SEED_DIR} to ${TARGET}"
              echo "  desired=${desired} current=${current}"

              mkdir -p "${TARGET}"

              # 反映対象（Git管理下に置きやすい領域）:
              # - themes, plugins, mu-plugins, languages
              # - wp-content 直下のファイル（例: advanced-cache.php 等）
              #
              # 反映しない（運用データ）:
              # - uploads, cache, debug.log など
              #
              # ※ “削除も含めたミラー” を themes/plugins/mu-plugins/languages に対して行い、
              #    uploads は保持します。

              for d in themes plugins mu-plugins languages; do
                if [ -d "${SEED_DIR}/${d}" ]; then
                  rm -rf "${TARGET:?}/${d}"
                  mkdir -p "${TARGET}/${d}"
                  # tar でコピー（cpのメタデータ差で事故りにくい）
                  tar -C "${SEED_DIR}/${d}" -cf - . | tar -C "${TARGET}/${d}" -xpf -
                fi
              done

              # wp-content 直下の “ファイルだけ” を同期（ディレクトリは上で扱う）
              # 例: index.php, advanced-cache.php, object-cache.php, .user.ini など
              find "${SEED_DIR}" -maxdepth 1 -type f \
                ! -name ".seed-version" \
                ! -name "debug.log" \
                -print0 \
                | while IFS= read -r -d '' f; do
                    base="$(basename "$f")"
                    cp -f "$f" "${TARGET}/${base}"
                  done

              # 所有権（WordPress コンテナは www-data）
              chown -R www-data:www-data "${TARGET}" || true

              # バージョン更新
              echo -n "${desired}" > "${VERSION_FILE}"
              echo "seed version updated: ${desired}"

          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content

      containers:
        - name: wordpress
          image: wordpress:6.6-php8.2-apache
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_HOST
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_NAME
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: WORDPRESS_DB_PASSWORD

            # ネットワーク基底は /（/wp-admin と /wp-admin/network が正）
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $host = $_SERVER['HTTP_HOST'] ?? 'localhost';

                define('WP_HOME',    'http://' . $host);
                define('WP_SITEURL', 'http://' . $host);

                define('MULTISITE', true);
                define('SUBDOMAIN_INSTALL', false);
                define('DOMAIN_CURRENT_SITE', $host);
                define('PATH_CURRENT_SITE', '/');
                define('SITE_ID_CURRENT_SITE', 1);
                define('BLOG_ID_CURRENT_SITE', 1);

                // 切り分け用：stderrへ（落ち着いたら false に戻す）
                define('WP_DEBUG', true);
                define('WP_DEBUG_LOG', false);
                define('WP_DEBUG_DISPLAY', true);
                @ini_set('log_errors', '1');
                @ini_set('error_log', '/dev/stderr');

          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - |
                    set -eu
                    printf "ok\n" > /var/www/html/healthz || true
                    # .htaccess は上書きしない（WordPress 側に生成させる）

          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--port=3306"
            - "--structured-logs"
            - "mfeed-web-staging:asia-northeast1:mfeed-web-wordpress"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true

      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: mfeed
  labels:
    app: wordpress
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"wordpress-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wordpress-backendconfig
  namespace: mfeed
spec:
  healthCheck:
    requestPath: /healthz
    port: 80
    type: HTTP
  securityPolicy:
    name: allow-internal-only
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: mfeed
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: wp-gclb-ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-svc
                port:
                  number: 80
