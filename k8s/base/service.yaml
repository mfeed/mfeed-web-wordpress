apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  labels:
    app: www-mfeed-ad-jp-wordpress
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"wordpress-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: www-mfeed-ad-jp-wordpress
  ports:
    - name: http
      port: 80
      targetPort: http