apiVersion: v1
kind: ConfigMap
metadata:
  name: wp-exporter-scripts
  namespace: mfeed
data:
  exporter.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${GIT_URL:?}"; : "${GIT_BRANCH:=main}"
    : "${DB_HOST:=127.0.0.1}"; : "${DB_PORT:=3306}"
    : "${DB_NAME:?}"; : "${DB_USER:?}"; : "${DB_PASS:?}"

    WORK=/work
    REPO=$WORK/repo
    OUT=$REPO/wordpress-export
    mkdir -p "$WORK" "$OUT/db" "$OUT/uploads"

    eval "$(ssh-agent -s)" >/dev/null
    ssh-add /ssh/ssh-privatekey
    git config --global user.email "${GIT_EMAIL:-wp-exporter@example.com}"
    git config --global user.name  "${GIT_NAME:-wp-exporter}"
    git config --global --add safe.directory "$REPO" || true

    if [[ ! -d "$REPO/.git" ]]; then
      git clone --depth=1 --branch "$GIT_BRANCH" "$GIT_URL" "$REPO"
    else
      git -C "$REPO" fetch origin "$GIT_BRANCH" --depth=1
      git -C "$REPO" checkout "$GIT_BRANCH"
      git -C "$REPO" reset --hard "origin/$GIT_BRANCH"
    fi

    # ====== DB dump（差分出やすい/最小化） ======
    MYSQL="mysql -h $DB_HOST -P $DB_PORT -u$DB_USER -p$DB_PASS $DB_NAME"
    DUMP="mysqldump -h $DB_HOST -P $DB_PORT -u$DB_USER -p$DB_PASS --skip-comments --skip-extended-insert --single-transaction $DB_NAME"

    # 1) 重要オプションのみ
    $DUMP wp_options --where="option_name IN ('blogname','blogdescription','siteurl','home','permalink_structure')" \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/options.sql"

    # 2) 公開済み投稿とメタ（ID順）
    $DUMP wp_posts --where="post_status IN ('publish','future')" --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/posts.sql"
    $DUMP wp_postmeta --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/postmeta.sql"

    # 3) ターム・タクソノミ
    $DUMP wp_terms --order-by-primary       | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/terms.sql"
    $DUMP wp_term_taxonomy --order-by-primary | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/term_taxonomy.sql"
    $DUMP wp_term_relationships --order-by-primary | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/term_relationships.sql"

    # 4) 有効テーマ/プラグイン名のヒント（wp_options）
    $MYSQL -N -e "SELECT option_name, option_value FROM wp_options WHERE option_name IN ('template','stylesheet','active_plugins')" \
      | sed 's/\t/ = /' > "$OUT/db/active.txt"

    # ====== uploads は別プロセス（watcher）に任せる ======

    # 変更があれば commit/push
    git -C "$REPO" add -A
    if ! git -C "$REPO" diff --cached --quiet; then
      git -C "$REPO" commit -m "chore(export): db snapshot $(date -u +%FT%TZ)"
      git -C "$REPO" push origin "$GIT_BRANCH"
      echo "[exporter] pushed changes"
    else
      echo "[exporter] no changes"
    fi

  watcher.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${GIT_URL:?}"; : "${GIT_BRANCH:=main}"
    : "${UPLOADS_SRC:=/wp/wp-content/uploads}"

    DEBOUNCE=${DEBOUNCE_SECONDS:-60}

    WORK=/work
    REPO=$WORK/repo
    OUT=$REPO/wordpress-export/uploads
    mkdir -p "$WORK" "$OUT"

    eval "$(ssh-agent -s)" >/dev/null
    ssh-add /ssh/ssh-privatekey
    git config --global user.email "${GIT_EMAIL:-wp-exporter@example.com}"
    git config --global user.name  "${GIT_NAME:-wp-exporter}"
    git config --global --add safe.directory "$REPO" || true

    if [[ ! -d "$REPO/.git" ]]; then
      git clone --depth=1 --branch "$GIT_BRANCH" "$GIT_URL" "$REPO"
    else
      git -C "$REPO" fetch origin "$GIT_BRANCH" --depth=1
      git -C "$REPO" checkout "$GIT_BRANCH"
      git -C "$REPO" reset --hard "origin/$GIT_BRANCH"
    fi

    rsync -a --delete "$UPLOADS_SRC"/ "$OUT"/

    last_ts=0
    commit_push() {
      git -C "$REPO" add -A
      if ! git -C "$REPO" diff --cached --quiet; then
        git -C "$REPO" commit -m "chore(export): uploads snapshot $(date -u +%FT%TZ)"
        git -C "$REPO" push origin "$GIT_BRANCH"
        echo "[watcher] pushed uploads"
      fi
    }

    # 初回同期
    commit_push

    # inotify 監視 + デバウンス
    inotifywait -m -r -e close_write,create,delete,move "$UPLOADS_SRC" | while read -r _; do
      now=$(date +%s)
      if (( now - last_ts < DEBOUNCE )); then continue; fi
      last_ts=$now
      rsync -a --delete "$UPLOADS_SRC"/ "$OUT"/
      commit_push
    done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wp-exporter-sa
  namespace: mfeed
  annotations:
    iam.gke.io/gcp-service-account: cloudsql-proxy@mfeed-web-staging.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wp-db-export
  namespace: mfeed
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: wp-exporter-sa
          restartPolicy: Never
          volumes:
            - name: scripts
              configMap:
                name: wp-exporter-scripts
                defaultMode: 0755
            - name: git-ssh
              secret:
                secretName: git-ssh
                defaultMode: 0400
          containers:
            - name: exporter
              image: debian:bookworm-slim
              command: ["/bin/bash","-lc","/scripts/exporter.sh"]
              env:
                - name: GIT_URL
                  value: "git@github.com:mfeed/mfeed-web-wordpress.git"
                - name: GIT_BRANCH
                  value: "main"
                - name: GIT_EMAIL
                  value: "y-matsuda@mfeed.ad.jp "
                - name: GIT_NAME
                  value: "y-matsuda"
                - name: DB_HOST
                  value: "127.0.0.1"
                - name: DB_PORT
                  value: "3306"
                - name: DB_NAME
                  valueFrom: { secretKeyRef: { name: mysql-secret, key: wp-dbname, optional: true } }
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: mysql-secret, key: wp-user } }
                - name: DB_PASS
                  valueFrom: { secretKeyRef: { name: mysql-secret, key: wp-password } }
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
                - { name: git-ssh, mountPath: /ssh, readOnly: true }
                - { name: git-ssh, mountPath: /root/.ssh/known_hosts, subPath: known_hosts, readOnly: true }
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
              # 必要なパッケージをインストール
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -lc
                      - |
                        apt-get update -qq
                        apt-get install -y -qq --no-install-recommends \
                          ca-certificates git openssh-client mariadb-client rsync
            - name: cloud-sql-proxy
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
              args:
                - "--port=3306"
                - "--structured-logs"
                - "mfeed-web-staging:asia-northeast1:mfeed-web-wordpress" 
              resources:
                requests: { cpu: "10m", memory: "64Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-uploads-watcher
  namespace: mfeed
spec:
  replicas: 1
  selector:
    matchLabels: { app: wp-uploads-watcher }
  template:
    metadata:
      labels: { app: wp-uploads-watcher }
    spec:
      serviceAccountName: wp-exporter-sa
      volumes:
        - name: scripts
          configMap:
            name: wp-exporter-scripts
            defaultMode: 0755
        - name: git-ssh
          secret:
            secretName: git-ssh
            defaultMode: 0400
        - name: wp-data
          persistentVolumeClaim:
            claimName: wp-data
      containers:
        - name: watcher
          image: debian:bookworm-slim
          command: ["/bin/bash","-lc","/scripts/watcher.sh"]
          env:
            - name: GIT_URL
              value: "git@github.com:mfeed/mfeed-web-wordpress.git"
            - name: GIT_BRANCH
              value: "main"
            - name: GIT_EMAIL
              value: "y-matsuda@mfeed.ad.jp "
            - name: GIT_NAME
              value: "y-matsuda"
            - name: UPLOADS_SRC
              value: "/wp/wp-content/uploads"
            - name: DEBOUNCE_SECONDS
              value: "60"
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: git-ssh, mountPath: /ssh, readOnly: true }
            - { name: git-ssh, mountPath: /root/.ssh/known_hosts, subPath: known_hosts, readOnly: true }
            - { name: wp-data, mountPath: /wp, readOnly: true }
          resources:
            requests: { cpu: "20m", memory: "128Mi" }
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -lc
                  - |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends \
                      ca-certificates git openssh-client inotify-tools rsync

