apiVersion: v1
kind: ConfigMap
metadata:
  name: wp-exporter-scripts
  namespace: mfeed
data:
  exporter.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${GIT_URL:?}"; : "${GIT_BRANCH:=main}"
    : "${DB_HOST:=127.0.0.1}"; : "${DB_PORT:=3306}"
    : "${DB_NAME:?}"; : "${DB_USER:?}"; : "${DB_PASS:?}"

    WORK=/work
    REPO=$WORK/repo
    OUT=$REPO/wordpress-export
    mkdir -p "$WORK" "$OUT/db" "$OUT/uploads"

    mkdir -p /root/.ssh
    chmod 700 /root/.ssh

    # ssh-agent は使わず、固定鍵で
    export GIT_SSH_COMMAND="ssh -i /ssh/ssh-privatekey -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes"

    git config --global user.email "${GIT_EMAIL:-wp-exporter@example.com}"
    git config --global user.name  "${GIT_NAME:-wp-exporter}"
    git config --global --add safe.directory "$REPO" || true

    if [[ ! -d "$REPO/.git" ]]; then
      git clone --branch "$GIT_BRANCH" "$GIT_URL" "$REPO"
    fi

    # 最新に揃える（浅い clone は rebase で詰まることがあるので depth は使わない）
    git -C "$REPO" fetch origin "$GIT_BRANCH"
    git -C "$REPO" checkout "$GIT_BRANCH"
    git -C "$REPO" reset --hard "origin/$GIT_BRANCH"

    MYSQL=(mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USER" -p"$DB_PASS" "$DB_NAME")
    DUMP=(mysqldump -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --skip-comments --skip-extended-insert --single-transaction "$DB_NAME")

    # ====== DB dump（差分出やすい物は絞る） ======
    "${DUMP[@]}" wp_options --where="option_name IN ('blogname','blogdescription','siteurl','home','permalink_structure','stylesheet','template')" \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/options.sql"

    "${DUMP[@]}" wp_posts --where="post_status IN ('publish','future')" --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/posts.sql"

    "${DUMP[@]}" wp_postmeta --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/postmeta.sql"

    "${DUMP[@]}" wp_terms --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/terms.sql"

    "${DUMP[@]}" wp_term_taxonomy --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/term_taxonomy.sql"

    "${DUMP[@]}" wp_term_relationships --order-by-primary \
      | sed '/^\/\*!.*\*\/;$/d' > "$OUT/db/term_relationships.sql"

    # 有効テーマ/プラグイン確認
    "${MYSQL[@]}" -N -e "SELECT option_name, option_value FROM wp_options WHERE option_name IN ('template','stylesheet','active_plugins')" \
      | sed 's/\t/ = /' > "$OUT/db/active.txt"

    # ====== commit/push（競合対策: rebase） ======
    git -C "$REPO" add -A
    if git -C "$REPO" diff --cached --quiet; then
      echo "[exporter] no changes"
      exit 0
    fi

    git -C "$REPO" commit -m "chore(export): db snapshot $(date -u +%FT%TZ)"

    git -C "$REPO" fetch origin "$GIT_BRANCH"
    if ! git -C "$REPO" rebase "origin/$GIT_BRANCH"; then
      git -C "$REPO" rebase --abort || true
      echo "[exporter] rebase failed (someone pushed concurrently). retry next run."
      exit 1
    fi

    git -C "$REPO" push origin "$GIT_BRANCH"
    echo "[exporter] pushed changes"

  watcher.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${GIT_URL:?}"; : "${GIT_BRANCH:=main}"
    : "${UPLOADS_SRC:=/wp-content/uploads}"
    : "${DEBOUNCE_SECONDS:=60}"

    WORK=/work
    REPO=$WORK/repo
    OUT=$REPO/wordpress-export/uploads
    mkdir -p "$WORK" "$OUT"

    mkdir -p /root/.ssh
    chmod 700 /root/.ssh

    export GIT_SSH_COMMAND="ssh -i /ssh/ssh-privatekey -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes"

    git config --global user.email "${GIT_EMAIL:-wp-exporter@example.com}"
    git config --global user.name  "${GIT_NAME:-wp-exporter}"
    git config --global --add safe.directory "$REPO" || true

    if [[ ! -d "$REPO/.git" ]]; then
      git clone --branch "$GIT_BRANCH" "$GIT_URL" "$REPO"
    fi

    git -C "$REPO" fetch origin "$GIT_BRANCH"
    git -C "$REPO" checkout "$GIT_BRANCH"
    git -C "$REPO" reset --hard "origin/$GIT_BRANCH"

    sync_and_push() {
      rsync -a --delete "$UPLOADS_SRC"/ "$OUT"/

      git -C "$REPO" add -A
      if git -C "$REPO" diff --cached --quiet; then
        echo "[watcher] no changes"
        return 0
      fi

      git -C "$REPO" commit -m "chore(export): uploads snapshot $(date -u +%FT%TZ)"

      git -C "$REPO" fetch origin "$GIT_BRANCH"
      if ! git -C "$REPO" rebase "origin/$GIT_BRANCH"; then
        git -C "$REPO" rebase --abort || true
        echo "[watcher] rebase failed. will retry on next change."
        return 1
      fi

      git -C "$REPO" push origin "$GIT_BRANCH"
      echo "[watcher] pushed uploads"
    }

    # 初回同期
    sync_and_push || true

    last_push=0
    inotifywait -m -r -e close_write,create,delete,move "$UPLOADS_SRC" | while read -r _; do
      now=$(date +%s)
      if (( now - last_push < DEBOUNCE_SECONDS )); then
        continue
      fi
      last_push=$now
      sync_and_push || true
    done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wp-exporter-sa
  namespace: mfeed
  annotations:
    iam.gke.io/gcp-service-account: cloudsql-proxy@mfeed-web-staging.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wp-db-export
  namespace: mfeed
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: wp-exporter-sa
          restartPolicy: Never
          volumes:
            - name: scripts
              configMap:
                name: wp-exporter-scripts
                defaultMode: 0755
            - name: git-ssh
              secret:
                secretName: git-ssh
                defaultMode: 0400
            - name: work
              emptyDir: {}
          containers:
            - name: exporter
              image: asia-northeast1-docker.pkg.dev/mfeed-web-staging/mfeed-web-staging-repo/wp-exporter:bookworm
              command: ["/bin/bash","-lc","/scripts/exporter.sh"]
              env:
                - name: GIT_URL
                  value: "git@github.com:mfeed/mfeed-web-wordpress.git"
                - name: GIT_BRANCH
                  value: "main"
                - name: GIT_EMAIL
                  value: "y-matsuda@mfeed.ad.jp"
                - name: GIT_NAME
                  value: "y-matsuda"

                - name: DB_HOST
                  value: "127.0.0.1"
                - name: DB_PORT
                  value: "3306"
                - name: DB_NAME
                  valueFrom: { secretKeyRef: { name: mysql-secret, key: WORDPRESS_DB_NAME } }
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: mysql-secret, key: WORDPRESS_DB_USER } }
                - name: DB_PASS
                  valueFrom: { secretKeyRef: { name: mysql-secret, key: WORDPRESS_DB_PASSWORD } }

              volumeMounts:
                - { name: scripts,  mountPath: /scripts }
                - { name: git-ssh,  mountPath: /ssh, readOnly: true }
                - { name: git-ssh,  mountPath: /root/.ssh/known_hosts, subPath: known_hosts, readOnly: true }
                - { name: work,     mountPath: /work }

              resources:
                requests: { cpu: "50m", memory: "128Mi" }

            - name: cloud-sql-proxy
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
              args:
                - "--port=3306"
                - "--structured-logs"
                - "mfeed-web-staging:asia-northeast1:mfeed-web-wordpress"
              resources:
                requests: { cpu: "10m", memory: "64Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-uploads-watcher
  namespace: mfeed
spec:
  replicas: 1
  selector:
    matchLabels: { app: wp-uploads-watcher }
  template:
    metadata:
      labels: { app: wp-uploads-watcher }
    spec:
      serviceAccountName: wp-exporter-sa
      volumes:
        - name: scripts
          configMap:
            name: wp-exporter-scripts
            defaultMode: 0755
        - name: git-ssh
          secret:
            secretName: git-ssh
            defaultMode: 0400
        - name: work
          emptyDir: {}
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
      containers:
        - name: watcher
          image: asia-northeast1-docker.pkg.dev/mfeed-web-staging/mfeed-web-staging-repo/wp-exporter:bookworm
          command: ["/bin/bash","-lc","/scripts/watcher.sh"]
          env:
            - name: GIT_URL
              value: "git@github.com:mfeed/mfeed-web-wordpress.git"
            - name: GIT_BRANCH
              value: "main"
            - name: GIT_EMAIL
              value: "y-matsuda@mfeed.ad.jp"
            - name: GIT_NAME
              value: "y-matsuda"

            - name: UPLOADS_SRC
              value: "/wp-content/uploads"
            - name: DEBOUNCE_SECONDS
              value: "60"

          volumeMounts:
            - { name: scripts,    mountPath: /scripts }
            - { name: git-ssh,    mountPath: /ssh, readOnly: true }
            - { name: git-ssh,    mountPath: /root/.ssh/known_hosts, subPath: known_hosts, readOnly: true }
            - { name: work,       mountPath: /work }
            - { name: wp-content, mountPath: /wp-content, readOnly: true }

          resources:
            requests: { cpu: "20m", memory: "128Mi" }
