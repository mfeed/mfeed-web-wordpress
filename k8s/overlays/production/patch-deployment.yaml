apiVersion: apps/v1
kind: Deployment
metadata:
  name: www-mfeed-ad-jp-wordpress
spec:
  replicas: 3
  template:
    spec:
      initContainers:
        - name: seed-wp-content
          env:
            - name: WP_CONTENT_SEED_VERSION
              value: "prod"
      containers:
        - name: www-mfeed-ad-jp-wordpress
#          env:
#            - name: WORDPRESS_CONFIG_EXTRA
#              value: |
#                define('WP_HOME',    'https://www.mfeed.ad.jp');
#                define('WP_SITEURL', 'https://www.mfeed.ad.jp');
                $_SERVER['HTTPS'] = 'on';
        - name: cloud-sql-proxy
          args:
            - "--port=3306"
            - "--structured-logs"
            - "mfeed-web-production:asia-northeast1:mfeed-web-wordpress"