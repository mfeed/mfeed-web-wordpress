apiVersion: batch/v1
kind: Job
metadata:
  name: sync-mfeed-wp-content
  namespace: web-production
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: mfeed-web
    app.kubernetes.io/environment: production
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/part-of: mfeed-web
        app.kubernetes.io/environment: production
        job-name: sync-mfeed-wp-content
    spec:
      restartPolicy: Never
      serviceAccountName: wordpress-sa
      securityContext:
        fsGroup: 33
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: sync
          image: asia-northeast1-docker.pkg.dev/mfeed-web-1/mfeed-web-production-repo/wordpress:stable
          imagePullPolicy: Always
          command: ["sh", "-lc"]
          args:
            - |
              set -euo pipefail

              SRC="/seed/wp-content"
              DST="/var/www/html/wp-content"

              echo "== check source =="
              if [ ! -d "$SRC" ]; then
                echo "source wp-content directory not found: $SRC"
                exit 1
              fi

              echo "== prepare destination =="
              mkdir -p "$DST"

              echo "== install rsync if needed =="
              if ! command -v rsync >/dev/null 2>&1; then
                apt-get update
                apt-get install -y --no-install-recommends rsync
                rm -rf /var/lib/apt/lists/*
              fi

              echo "== before sync =="
              echo "-- themes --"
              ls -la "$DST/themes" || true
              echo "-- plugins --"
              ls -la "$DST/plugins" || true
              echo "-- mu-plugins --"
              ls -la "$DST/mu-plugins" || true

              echo "== sync wp-content (mirror) =="
              rsync -aH --delete --numeric-ids \
                "$SRC"/ "$DST"/

              echo "== fix ownership =="
              chown -R www-data:www-data "$DST" || true

              echo "== verify themes =="
              ls -la "$DST/themes" || true
              ls -la "$DST/themes/transix" || true
              ls -la "$DST/themes/mfeed" || true

              echo "== verify plugins =="
              ls -la "$DST/plugins" || true

              echo "== sync complete =="
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc