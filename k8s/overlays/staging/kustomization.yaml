apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/environment: staging
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/part-of: mfeed-web

resources:
  - namespace.yaml
  - ../../base
  - service.yaml
  - secretproviderclass.yaml
#  - ingress.yaml
#  - ingress-ipv6.yaml
#  - backendconfig.yaml
  - ingress-www-mfeed-ad-jp.yaml
  - ingress-www-mfeed-ad-jp-assets.yaml
  - ingress-www-mfeed-ad-jp-domain-redirection.yaml

namespace: web-staging

images:
  - name: wordpress
    newName: asia-northeast1-docker.pkg.dev/mfeed-web-staging/mfeed-web-staging-repo/wordpress
    newTag: stable

patches:
  - path: patch-deployment.yaml
  - path: patch-serviceaccount.yaml
#  - path: patch-backendconfig.yaml
#  - path: patch-ingress.yaml
#  - path: patch-ingress-ipv6.yaml

commonLabels:
  app.kubernetes.io/environment: staging