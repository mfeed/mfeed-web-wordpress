apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfeed-wordpress-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: wp-gclb-ip
spec:
  rules:
    - host: www.wp-stg.mfeed.ad.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mfeed-wordpress-svc
                port:
                  number: 80