# wp-content を「完全ミラー」で PVC に反映する破壊的な Job。
# uploads も含めてシード（= GitHub）に無いものは消える。
#
# 通常のデプロイでは restore-mfeed-wp-content（uploads はマージ）を使うこと。
# こちらは PVC を GitHub の内容ちょうどに戻したいときだけ使う。
#
#   kubectl -n web-staging delete job sync-mfeed-wp-content --ignore-not-found
#   kubectl apply -f k8s/overlays/staging/sync-mfeed-wp-content.yaml
#   kubectl -n web-staging wait --for=condition=complete job/sync-mfeed-wp-content --timeout=30m
#   kubectl -n web-staging logs job/sync-mfeed-wp-content
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-mfeed-wp-content
  namespace: web-staging
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: mfeed-web
    app.kubernetes.io/environment: staging
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/part-of: mfeed-web
        app.kubernetes.io/environment: staging
        job-name: sync-mfeed-wp-content
    spec:
      restartPolicy: Never
      serviceAccountName: wordpress-sa
      securityContext:
        fsGroup: 33
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: sync
          image: asia-northeast1-docker.pkg.dev/mfeed-web-staging/mfeed-web-staging-repo/wordpress:stable
          imagePullPolicy: Always
          command: ["/usr/local/bin/sync-wp-content.sh"]
          env:
            # マージ扱いのディレクトリを無くす = uploads も含めて完全ミラー
            - name: WP_CONTENT_MERGE_DIRS
              value: ""
            # シードに無いトップレベル項目も消す
            - name: WP_CONTENT_PRUNE
              value: "1"
            - name: WP_CONTENT_SEED_FORCE
              value: "1"
            - name: WP_CONTENT_SEED_VERSION
              value: "manual"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
