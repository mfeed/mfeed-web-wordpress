# echo-mini.yaml  （そのまま apply でOK）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      containers:
      - name: echo
        image: gcr.io/google-containers/echoserver:1.10
        ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: echo-svc
  namespace: default
spec:
  type: NodePort
  selector: { app: echo }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mini-ing
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"                # 旧注釈
spec:
  ingressClassName: gce                                # 新方式
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: echo-svc
            port:
              number: 80
